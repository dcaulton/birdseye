version: "3.9"

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: birdseye-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: birdseye
    ports:
      - "5432:5432"
    volumes:
      - birdseye_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d birdseye"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  birdseye_pg_data:
