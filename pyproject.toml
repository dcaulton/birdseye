[project]
name = "birdseye"
version = "0.1.0"
description = "Drone video analysis and geospatial monitoring for Weathervane"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "geoalchemy2>=0.15.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.0.0",
    "python-multipart>=0.0.12",
    "alembic>=1.13.0",
    "structlog>=24.0.0",
    "numpy>=1.26.0",
    "opencv-python-headless>=4.10.0",
    "shapely>=2.1.2",
]

[tool.uv]
dev-dependencies = [
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pre-commit>=3.8.0",
    "pytest>=8.3.0",
    "httpx>=0.28.1",
    "pytest-cov>=7.1.0",
    "types-shapely>=2.1.0.20260603",
    "testcontainers[postgres]>=4.14.2",
    "sqlalchemy[mypy]>=2.0.50",
    "pydantic[mypy]>=2.13.4",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = false
mypy_path = ["src"]
ignore_missing_imports = true
warn_return_any = false
plugins = [
    "sqlalchemy.ext.mypy.plugin",
    "pydantic.mypy",
]

[[tool.mypy.overrides]]
module = "birdseye.tasks.processing"
ignore_errors = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
